name: server-release

on:
  push:
    branches:
      - main
    paths:
      - "inference-server/**"
      - ".github/workflows/server-release.yml"
  workflow_dispatch:

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/inference-server

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: inference-server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy

      - run: uv run pytest

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@v7

      # Provides the BuildKit features the Dockerfile is written against, plus
      # layer caching between runs. Not available on the dev machine, which is
      # why the Dockerfile avoids `--mount=type=cache`.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: inference-server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
