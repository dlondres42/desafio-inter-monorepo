name: server-ci

on:
  push:
    branches:
      - main
    paths:
      - "inference-server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "inference-server/**"
      - ".github/workflows/server-ci.yml"

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: inference-server

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy

      - run: uv run pytest
