[project]
name = "client-code"
version = "0.1.0"
description = "Notebook workspace for exercising the published dolores-lib"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "mlflow>=3.0",
    "joblib>=1.4",
]

# Not a package: this project exists only to host notebooks that consume
# dolores-lib as a published artifact. Nothing here is ever built or shipped.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.3",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
